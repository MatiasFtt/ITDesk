services:
  - type: web
    name: itdesk
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: itdesk-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: ITDESK_ADMIN_EMAIL
        value: admin@itdesk.local
      - key: ITDESK_ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.14.3

databases:
  - name: itdesk-db
    databaseName: itdesk
    user: itdesk
    plan: free
    region: virginia
